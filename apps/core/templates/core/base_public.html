{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MedViral{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/public.css' %}">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="logo">DataLab90</div>
    <nav class="nav">
      <a href="{% url 'accounts:login' %}" class="nav-link">로그인</a>
      <a href="{% url 'accounts:signup' %}" class="btn btn-primary">회원가입</a>
    </nav>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2025 MedViral. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
