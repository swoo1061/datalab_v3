{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Datalab90{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

  <!-- Public CSS -->
  <link rel="stylesheet" href="{% static 'core/css/public.css' %}">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">

    <!-- Logo -->
    <a href="{% url 'core:home' %}" class="logo">
      DataLab90
    </a>

    <!-- Header Actions -->
    {% block header_actions %}
    <nav class="nav">
      <a href="{% url 'accounts:login' %}" class="btn btn-primary">
        관리자 로그인
      </a>
    </nav>
    {% endblock %}

  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2025 Datalab90. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
