{% extends 'core/base_public.html' %}
{% load static %}
{% block title %}로그인 | MedViral{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">

<div class="auth-wrap">
  <div class="auth-box">
    <h1 class="auth-title">관리자 로그인</h1>
    <p class="auth-desc">
      MedViral 내부 시스템은 승인된 계정만 사용할 수 있습니다.
    </p>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label>아이디</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" name="password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        로그인
      </button>
    </form>

    <div class="auth-footer">
      <a href="{% url 'accounts:signup' %}">계정 신청</a>
    </div>
  </div>
</div>
{% endblock %}
