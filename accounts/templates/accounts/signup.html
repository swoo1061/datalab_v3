{% extends 'core/base_public.html' %}
{% load static %}
{% block title %}계정 신청 | MedViral{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">

<div class="auth-wrap">
  <div class="auth-box">
    <h1 class="auth-title">계정 신청</h1>
    <p class="auth-desc">
      내부 검토 후 계정이 활성화됩니다.
    </p>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label>이름</label>
        <input type="text" name="name" required>
      </div>

      <div class="form-group">
        <label>회사명</label>
        <input type="text" name="company" required>
      </div>

      <div class="form-group">
        <label>아이디</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" name="password1" required>
      </div>

      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" name="password2" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        계정 신청하기
      </button>
    </form>

    <div class="auth-footer">
      <a href="{% url 'accounts:login' %}">이미 계정이 있으신가요?</a>
    </div>
  </div>
</div>
{% endblock %}
