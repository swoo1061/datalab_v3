{% extends 'core/base_public.html' %}
{% load static %}

{% block title %}계정 신청 | Datalab90{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <h1 class="auth-title">계정 신청</h1>
    <p class="auth-desc">내부 검토 후 계정이 활성화됩니다.</p>

    <form method="post" onsubmit="return validatePosition()">
      {% csrf_token %}

      <div class="auth-field">
        <label class="auth-label">이름</label>
        <input type="text" name="name" required>
      </div>

      <div class="auth-field">
        <label class="auth-label">이메일</label>
        <input type="email" name="email" required>
      </div>

      <div class="auth-field">
        <label class="auth-label">아이디</label>
        <input type="text" name="username" required>
      </div>

      <div class="auth-field">
        <label class="auth-label">비밀번호</label>
        <input type="password" name="password1" required>
      </div>

      <div class="auth-field">
        <label class="auth-label">비밀번호 확인</label>
        <input type="password" name="password2" required>
      </div>

      <!-- 직급 선택 -->
      <div class="auth-field">
        <label class="auth-label">직급</label>

        <div class="auth-position">
          <div class="auth-position-btn" onclick="selectPosition(this,'manager')">매니저</div>
          <div class="auth-position-btn" onclick="selectPosition(this,'leader')">팀장</div>
          <div class="auth-position-btn" onclick="selectPosition(this,'ceo')">대표이사</div>
        </div>

        <input type="hidden" name="position" id="positionInput">
      </div>

      <button type="submit" class="btn btn-primary btn-block">계정 신청하기</button>
    </form>

    <div class="auth-footer">
      <a href="{% url 'accounts:login' %}">이미 계정이 있으신가요?</a>
    </div>
  </div>
</div>
{% endblock %}
