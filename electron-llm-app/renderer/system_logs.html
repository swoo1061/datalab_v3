<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 시스템 로그</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/business_mode.css" />
  <link rel="stylesheet" href="css/system_logs.css" />
</head>
<body class="theme-vivid tone-sidebar" data-nav="system_logs">

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope logs-page">
      <section class="page-canvas">
        <header class="page-head">
          <div>
            <h1 class="h1">시스템 로그</h1>
            <p class="sub">서버 접속 로그와 방화벽 상태를 확인합니다.</p>
          </div>
          <div class="logs-head-actions">
            <button id="logsExportBtn" class="btn btn-ghost" type="button">CSV 내보내기</button>
            <button id="logsRefreshBtn" class="btn" type="button">새로고침</button>
          </div>
        </header>

        <section class="card logs-shell">
          <div class="logs-summary" id="logsSummary"></div>
          <div class="logs-anomalies" id="logsAnomalies"></div>

          <div class="logs-toolbar">
            <input id="logsSearchInput" class="input" type="text" placeholder="IP / 경로 검색" />
            <select id="logsMethodFilter" class="select">
              <option value="all">전체 메서드</option>
              <option value="GET">GET</option>
              <option value="POST">POST</option>
              <option value="PATCH">PATCH</option>
              <option value="DELETE">DELETE</option>
            </select>
            <select id="logsRangePreset" class="select logs-range-select">
              <option value="today">오늘</option>
              <option value="7d" selected>최근 7일</option>
              <option value="30d">최근 30일</option>
              <option value="custom">직접 선택</option>
            </select>
            <input id="logsFromDate" class="input logs-date" type="date" />
            <input id="logsToDate" class="input logs-date" type="date" />
            <button id="logsApplyRangeBtn" class="btn btn-ghost" type="button">기간 적용</button>
          </div>

          <div class="logs-insights">
            <div class="logs-panel">
              <h3 class="logs-panel-title">IP 상위 5</h3>
              <div id="logsTopIps" class="logs-kv-list muted">데이터 없음</div>
            </div>
            <div class="logs-panel">
              <h3 class="logs-panel-title">경로 상위 5</h3>
              <div id="logsTopPaths" class="logs-kv-list muted">데이터 없음</div>
            </div>
          </div>

          <div class="logs-table-wrap">
            <table class="table logs-table">
              <thead>
                <tr>
                  <th style="width: 20%;">시간</th>
                  <th style="width: 14%;">IP</th>
                  <th style="width: 10%;">메서드</th>
                  <th style="width: 24%;">경로</th>
                  <th>사용자 에이전트</th>
                </tr>
              </thead>
              <tbody id="logsTableBody">
                <tr><td colspan="5" class="muted">불러오는 중...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="logs-pagination">
            <button id="logsPrevBtn" class="btn btn-ghost" type="button">이전</button>
            <span id="logsPageInfo" class="muted">1 / 1</span>
            <button id="logsNextBtn" class="btn btn-ghost" type="button">다음</button>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>

<div id="logsDetailModal" class="logs-modal" aria-hidden="true">
  <div class="logs-modal-backdrop" data-close="1"></div>
  <section class="logs-modal-card" role="dialog" aria-modal="true" aria-label="로그 상세 정보">
    <header class="logs-modal-head">
      <h3>로그 상세</h3>
      <button id="logsModalCloseBtn" class="btn btn-ghost" type="button">닫기</button>
    </header>
    <div id="logsDetailBody" class="logs-detail-body"></div>
  </section>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/system_logs.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("시스템 로그");
  })();
</script>
</body>
</html>
