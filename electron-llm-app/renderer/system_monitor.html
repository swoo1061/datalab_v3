<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 시스템 모니터링</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/business_mode.css" />
  <link rel="stylesheet" href="css/system_monitor.css?v=20260206-2" />
</head>
<body class="theme-vivid tone-sidebar" data-nav="system_monitor">

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope monitor-page">
      <section class="page-canvas">
        <header class="page-head">
          <div>
            <h1 class="h1">시스템 모니터링</h1>
            <p class="sub">앱/서버 상태를 빠르게 확인합니다.</p>
          </div>
          <button id="monitorAutoBtn" class="btn monitor-auto-btn" type="button">ON</button>
        </header>

        <section class="card monitor-shell">

          <div class="monitor-summary" id="monitorSummaryCards"></div>

          <div class="monitor-grid">
            <section class="monitor-card">
              <h3>기본 정보</h3>
              <div id="monitorInfo" class="monitor-info"></div>
            </section>

            <section class="monitor-card">
              <h3>API 상태</h3>
              <div id="monitorApiChecks" class="monitor-list"></div>
            </section>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/system_monitor.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("시스템 모니터링");
  })();
</script>
</body>
</html>
