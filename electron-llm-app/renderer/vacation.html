<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 휴가 신청</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/business_mode.css" />
  <link rel="stylesheet" href="css/vacation.css" />
</head>
<body class="theme-vivid tone-sidebar" data-nav="vacation">

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope">
      <section class="page-canvas">
        <header class="page-head">
          <h1 class="h1">휴가 신청</h1>
          <p class="sub">연차/반차 신청과 내역을 관리합니다.</p>
        </header>

        <section class="card vacation-shell">
          <div class="vacation-summary" id="vacationSummary"></div>

          <div class="vacation-grid">
            <form class="vacation-form" id="vacationForm">
              <h3>휴가 신청</h3>
              <div class="vacation-field">
                <label>날짜</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                  <input id="vacationStart" class="input" type="date" required />
                  <input id="vacationEnd" class="input" type="date" required />
                </div>
                <div class="vacation-help" id="vacationDayHint">사용 일수: -</div>
              </div>
              <div class="vacation-field">
                <label>유형</label>
                <div class="vacation-radio vacation-type-group">
                  <label class="vacation-type">
                    <input type="radio" name="vacationType" value="annual" checked />
                    <span>연차</span>
                  </label>
                  <label class="vacation-type">
                    <input type="radio" name="vacationType" value="half_am" />
                    <span>오전반차</span>
                  </label>
                  <label class="vacation-type">
                    <input type="radio" name="vacationType" value="half_pm" />
                    <span>오후반차</span>
                  </label>
                </div>
                <div class="vacation-help">반차는 0.5일로 차감됩니다.</div>
              </div>
              <div class="vacation-field">
                <label>반차 시간표</label>
                <div class="vacation-shift" id="vacationShiftInfo"></div>
              </div>
              <div class="vacation-field">
                <label>비고</label>
                <textarea id="vacationReason" class="input" rows="3" placeholder="사유를 입력하세요."></textarea>
              </div>
              <button class="btn primary" type="submit">신청하기</button>
            </form>

            <div class="vacation-list">
              <div class="vacation-toolbar">
                <select id="vacationYear" class="select"></select>
                <div></div>
                <button id="vacationRefresh" class="btn" type="button">새로고침</button>
              </div>
              <div style="max-height: 520px; overflow:auto;">
                <table class="vacation-table">
                  <thead>
                    <tr>
                      <th style="width: 12%;">상태</th>
                      <th style="width: 18%;">신청일</th>
                      <th style="width: 18%;">기간</th>
                      <th style="width: 14%;">유형</th>
                      <th style="width: 10%;">사용일수</th>
                      <th>비고</th>
                    </tr>
                  </thead>
                  <tbody id="vacationListBody">
                    <tr><td colspan="6" class="muted">불러오는 중...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/vacation.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("휴가 신청");
  })();
</script>
</body>
</html>
