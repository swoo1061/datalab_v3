<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>강남언니 후기 생성</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/gangnam_review.css" />
</head>
<body data-nav="ai_review">

<div class="app-root">
  <div id="globalLoading" class="global-loading hidden" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-text">후기 생성 중입니다…</div>
      <div class="loading-sub">잠시만 기다려주세요</div>
    </div>
  </div>
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <div class="page-scope">

      <form class="review-form">

        <!-- LEFT -->
        <section class="form-col">

          <h2>시술 정보</h2>

          <div class="row-3">
            <div class="field">
              <label>병원명</label>
            <input id="hospitalName" placeholder="OOO 성형외과">
            </div>
            <div class="field">
              <label>시술 종류</label>
            <input id="procedureType" placeholder="눈매 교정">
            </div>
            <div class="field">
              <label>담당 의사</label>
            <input id="doctorName" placeholder="OOO 원장">
            </div>
          </div>
            <div class="field">
              <label>시술 상세</label>
          <input id="procedureDetail" placeholder="시술 상세">
            </div>

          <div class="row-2">
            <div class="field">
              <label>마취 여부</label>
              <select id="anesthesia">
                <option value="">선택</option>
                <option>수면마취</option>
                <option>크림마취</option>
                <option>국소마취</option>
                <option>부분수면마취</option>
                <option>전신마취</option>
                <option>마취 없음</option>
              </select>
            </div>
            <div class="field">
              <label>가격대</label>
              <input id="priceRange" placeholder="ex 200만원대">
            </div>
          </div>

          <div class="row-2">
            <div class="field">
              <label>시술 일자</label>
            <input type="date" id="procedureDate">
            </div>
            <div class="field">
              <label>작성 일자</label>
            <input type="date" id="writeDate">
            </div>
          </div>
            <div class="field">
              <label>시술 전 고민 / 결정 계기</label>
          <input id="beforeConcern" placeholder="ex 예뻐보일려고">
            </div>

            <div class="field">
              <label>강조하고 싶은 좋은점</label>
              <input id="goodPoints" placeholder="ex 자연스러운 라인">
            </div>

            <div class="field">
              <label>아쉬운 점</label>
              <input id="badPoints" placeholder="ex 대기시간 김">
            </div>

        </section>

        <!-- RIGHT -->
        <section class="form-col">

  <h2>작성자 · AI 설정</h2>

  <div class="row-3">

    <div class="field">
      <label>연령대</label>
      <select id="personaAge">
        <option>20대 초반</option>
        <option selected>20대 중후반</option>
        <option>30대 초반</option>
        <option>30대 중후반</option>
        <option>40대 이상</option>
      </select>
    </div>

    <div class="field">
      <label>성별</label>
      <select id="personaGender">
        <option>여성</option>
        <option>남성</option>
      </select>
    </div>

    <div class="field">
      <label>말투</label>
      <select id="personaTone">
        <option>친근한</option>
        <option>차분한</option>
        <option>활발한</option>
        <option>꼼꼼한</option>
      </select>
    </div>

  </div>

  <div class="field">
    <label>이모티콘 사용</label>
    <select id="emojiUsage">
      <option>적당히</option>
      <option>많이</option>
      <option>거의 안함</option>
    </select>
  </div>

  <div class="field">
    <label>피해야 할 표현</label>
    <textarea id="forbidden" placeholder="쉼표로 구분"></textarea>
  </div>

  <div class="field">
    <label>AI 모델</label>
    <select id="modelSelect"></select>
  </div>

  <div class="field">
    <label>창의성 (Temperature)</label>
    <div class="temp-row">
      <input type="range" id="temperature" min="0.5" max="1" step="0.05" value="0.85">
      <span id="tempValue">0.85</span>
    </div>
    <p class="form-hint">높을수록 다양한 표현 (권장: 0.8~0.95)</p>
  </div>

</section>

        <button type="button" class="generate-btn" id="generateBtn">
          후기 생성하기
        </button>

      </form>

    </div>
  </div>
</div>

<!-- Review Result Modal -->
<div id="reviewModal" class="modal hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-content review-result-modal">
    <!-- Header -->
    <header class="modal-header">
      <h3>생성 결과 (앱 입력 순서)</h3>
      <button id="closeReviewModal" class="close-btn" aria-label="닫기">X</button>
    </header>

    <!-- Body -->
    <section class="modal-body">
      <div id="dateInfo" class="date-info" style="display: none;">
        <span class="date-item">시술일: <strong id="display_procedure_date">-</strong></span>
        <span class="date-divider">|</span>
        <span class="date-item">작성일: <strong id="display_write_date">-</strong></span>
      </div>

      <div class="modal-grid">
        <div class="modal-main">
          <div class="result-section" data-section="before_worry">
            <div class="result-header">
              <span class="result-title">시술 전 고민과 시술을 결정한 계기</span>
              <div class="result-meta">
                <span class="char-count">0자</span>
                <button class="copy-btn" data-copy-section="before_worry">복사</button>
              </div>
            </div>
            <div class="result-content" id="result_before_worry"></div>
          </div>

          <div class="result-section" data-section="result_review">
            <div class="result-header">
              <span class="result-title">시술 결과 후기</span>
              <div class="result-meta">
                <span class="char-count">0자 (최소 10자)</span>
                <button class="copy-btn" data-copy-section="result_review">복사</button>
              </div>
            </div>
            <div class="result-content" id="result_result_review"></div>
          </div>

          <div class="result-section" data-section="bad_reason">
            <div class="result-header">
              <span class="result-title">아쉬운 점을 선택한 이유</span>
              <div class="result-meta">
                <span class="char-count">0자 (최소 10자)</span>
                <button class="copy-btn" data-copy-section="bad_reason">복사</button>
              </div>
            </div>
            <div class="result-content" id="result_bad_reason"></div>
          </div>

          <div class="result-section" data-section="rating">
            <div class="result-header">
              <span class="result-title">전체 경험 총점</span>
            </div>
            <div id="result_rating" class="result-rating">-</div>
          </div>

          <div class="result-section" data-section="additional">
            <div class="result-header">
              <span class="result-title">추가 의견</span>
              <div class="result-meta">
                <span class="char-count">0자 (최소 10자)</span>
                <button class="copy-btn" data-copy-section="additional">복사</button>
              </div>
            </div>
            <div class="result-content" id="result_additional"></div>
          </div>
        </div>

        <aside class="modal-side">
          <div class="result-section" data-section="reason_tags">
            <div class="result-header">
              <span class="result-title">이 병원 및 이벤트를 선택한 이유 (태그)</span>
            </div>
            <div class="tag-container" id="tags_reason"></div>
          </div>

          <div class="result-section" data-section="good_tags">
            <div class="result-header">
              <span class="result-title">좋았던 점 (태그)</span>
            </div>
            <div class="tag-container" id="tags_good"></div>
          </div>

          <div class="result-section" data-section="bad_tags">
            <div class="result-header">
              <span class="result-title">아쉬운 점 (태그)</span>
            </div>
            <div class="tag-container" id="tags_bad"></div>
          </div>
        </aside>
      </div>

      <textarea id="reviewResultText" class="raw-hidden" readonly></textarea>
    </section>

    <!-- Footer -->
    <footer class="modal-footer">
      <button id="copyAllBtn" class="btn-secondary">전체 복사</button>
      <button id="confirmReviewBtn" class="btn-primary">확인</button>
    </footer>
  </div>
</div>


<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/gangnam_review.js"></script>

<script>
(async () => {
  await loadLayout();
  await loadHeader("강남언니 후기 생성");
})();
</script>

</body>
</html>
