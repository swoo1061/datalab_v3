<header class="app-header header-scope">

  <!-- 왼쪽: 브랜드 / 페이지 -->
  <div class="app-brand">
    <strong class="brand-title" onclick="goDashboard()">Datalab90</strong>
    <span class="divider">|</span>
    <span class="page-title" id="pageTitle">내부 시스템</span>
    <button class="back-btn" onclick="window.history.back()" aria-label="뒤로가기">back</button>
  </div>

  <!-- 가운데: 전체 검색 -->
  <div class="header-center">
    <div class="global-search">
      <input
        id="globalSearch"
        type="text"
        placeholder="search"
      />
    </div>
  </div>

  <!-- 오른쪽: 시계 + 사용자 -->
  <div class="header-right">
    <div class="live-clock">
  <div class="clock-date" id="liveDate">----</div>
  <div class="clock-time" id="liveClock">--:--:--</div>
</div>

    <div class="header-notify">
      <button class="notify-btn" id="notifyButton" aria-label="알림">
        <span class="notify-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
          </svg>
        </span>
        <span class="notify-badge hidden" id="notifyBadge">0</span>
      </button>
      <div class="notify-dropdown hidden" id="notifyDropdown">
        <div class="notify-head">
          <span>알림</span>
          <button class="notify-open" id="notifyOpenCenter" type="button">전체보기</button>
        </div>
        <div class="notify-list" id="notifyList"></div>
        <div class="notify-empty hidden" id="notifyEmpty">새 알림 없음</div>
        <div class="notify-detail hidden" id="notifyDetail">
          <div class="notify-detail-head">
            <button class="notify-back" id="notifyBack">목록</button>
            <strong id="notifyDetailTitle">메모</strong>
          </div>
          <div class="notify-detail-meta" id="notifyDetailMeta"></div>
          <div class="notify-detail-content" id="notifyDetailContent"></div>
          <div class="notify-detail-actions">
            <button class="notify-open" id="notifyDetailOpen">메모 상세로</button>
            <button class="notify-delete" id="notifyDetailDelete">삭제</button>
          </div>
        </div>
      </div>
    </div>

    <div class="user-area">
      <!-- ✅ 이름만 클릭 -->
      <div class="user-chip" id="userChip">
        <span id="userName">사용자</span>
      </div>

      <!-- 프로필 팝업 -->
      <div id="profilePopup" class="profile-popup hidden">
        <div class="profile-row">
          <strong id="profileName">-</strong>
          <div id="profilePosition" class="position-text">-</div>
        </div>

        <hr />

        <div class="profile-menu">
            <div class="menu-item" data-action="profile">기본 정보</div>
          </div>

          <hr />
  
          <div class="popup-actions">
            <button class="popup-btn" onclick="logout()">로그아웃</button>
            <button class="popup-btn" onclick="quitApp()">종료</button>
          </div>
      </div>
    </div>
  </div>

</header>

<!-- 기본 정보 팝업 -->
<div id="profileInfoModal" class="profile-info-modal hidden">
  <h3>기본 정보</h3>
  <button class="popup-btn info-back-btn" onclick="closeProfileInfo()" aria-label="뒤로가기">←</button>

  <div class="info-row">
    <span>이름</span>
    <strong id="infoName">-</strong>
  </div>

  <div class="info-row">
    <span>이메일</span>
    <strong id="infoEmail">-</strong>
  </div>

  <div class="info-row">
    <span>전화번호</span>
    <strong id="infoPhone">-</strong>
  </div>

  <div class="info-row">
    <span>생년월일</span>
    <strong id="infoBirth">-</strong>
  </div>
</div>
