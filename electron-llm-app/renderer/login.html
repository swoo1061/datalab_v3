<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로그인</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="center-screen">

<div class="login-drag-bar" aria-hidden="true"></div>
<div class="login-card">
  <header class="login-header">
    <div class="login-header-time">
      <span id="loginDate">----</span>
      <span id="loginTime">--:--</span>
    </div>
    <button class="login-quit" onclick="quitApp()">앱 종료</button>
  </header>

  <h1 class="logo">Datalab90</h1>
  <p class="subtitle">Internal System</p>

  <form id="loginForm">
    <input id="username" placeholder="아이디" />
    <input id="password" type="password" placeholder="비밀번호" />

    <p id="message" class="msg"></p>
    
    <div class="action-row">
      <button type="submit">login</button>
      <button type="button" class="signup-btn" onclick="goSignup()">signup</button>
    </div>
    <!-- ? 체크 영역 -->
    <div class="checkbox-row">
      <input type="checkbox" id="rememberLogin" />
      <label for="rememberLogin">로그인 상태 유지</label>
    </div>
  </form>

  <p class="hint">내부 사용자만 접속 가능합니다</p>
</div>

<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
