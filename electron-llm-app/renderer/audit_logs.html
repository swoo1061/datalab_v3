<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 감사 로그</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/business_mode.css" />
  <link rel="stylesheet" href="css/audit_logs.css" />
</head>
<body class="theme-vivid tone-sidebar" data-nav="audit_logs">

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope audit-page">
      <section class="page-canvas">
        <header class="page-head">
          <div>
            <h1 class="h1">감사 로그</h1>
            <p class="sub">권한 변경 등 주요 관리자 작업 이력을 확인합니다.</p>
          </div>
          <button id="auditRefreshBtn" class="btn" type="button">새로고침</button>
        </header>

        <section class="card audit-shell">
          <div class="audit-toolbar">
            <input id="auditSearchInput" class="input" type="text" placeholder="이벤트/사용자/대상 검색" />
            <select id="auditEventType" class="select">
              <option value="">전체 이벤트</option>
            </select>
            <input id="auditFromDate" class="input audit-date" type="date" />
            <input id="auditToDate" class="input audit-date" type="date" />
            <button id="auditApplyBtn" class="btn btn-ghost" type="button">적용</button>
          </div>

          <div class="audit-table-wrap">
            <table class="table audit-table">
              <thead>
                <tr>
                  <th style="width: 20%">시간</th>
                  <th style="width: 18%">이벤트</th>
                  <th style="width: 18%">작업자</th>
                  <th style="width: 20%">대상</th>
                  <th>변경 요약</th>
                </tr>
              </thead>
              <tbody id="auditTableBody">
                <tr><td colspan="5" class="muted">불러오는 중...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="audit-pagination">
            <button id="auditPrevBtn" class="btn btn-ghost" type="button">이전</button>
            <span id="auditPageInfo" class="muted">1 / 1</span>
            <button id="auditNextBtn" class="btn btn-ghost" type="button">다음</button>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>

<div id="auditDetailModal" class="audit-modal" aria-hidden="true">
  <div class="audit-modal-backdrop" data-close="1"></div>
  <section class="audit-modal-card" role="dialog" aria-modal="true" aria-label="감사 로그 상세">
    <header class="audit-modal-head">
      <h3>감사 로그 상세</h3>
      <button id="auditModalCloseBtn" class="btn btn-ghost" type="button">닫기</button>
    </header>
    <div id="auditDetailBody" class="audit-detail-body"></div>
  </section>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/audit_logs.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("감사 로그");
  })();
</script>
</body>
</html>
