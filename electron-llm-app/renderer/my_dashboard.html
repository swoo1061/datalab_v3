<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 나의 대시보드</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/schedule.css" />
</head>
<body>

<div class="app-root">
  <!-- 사이드바 -->
  <div class="app-sidebar-slot" id="appSidebar"></div>

  <!-- 헤더 -->
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
            <main class="page-scope dashboard-page">
        <section class="page-canvas">

            <header class="page-head">
            <h1 class="h1">나의 대시보드</h1>
            <p class="sub">개인공간</p>
            </header>

            <div class="dashboard-panels">
              <section class="dashboard-panel card">
                <div class="card-hd">개인 주간 스케줄</div>
                <div class="card-bd">
                  
                  <div class="week-panel">
                    <div class="week-head">
                      <div class="week-title">주간 작업 목록</div>
                      <div class="week-controls">
                        <button class="btn" id="weekPrevBtn">이번 주</button>
                        <span id="weekLabel" class="week-label"></span>
                        <button class="btn" id="weekNextBtn">다음 주</button>
                      </div>
                    </div>
                    <div class="card-bd">
                      <div id="myScheduleList" class="schedule-list"></div>
                    </div>
                  </div>
                </div>
              </section>

              <section class="dashboard-panel card">
                <div class="card-hd">담당 병원</div>
                <div class="card-bd">
                  <section id="myClinicGrid" class="clinic-grid"></section>
                </div>
              </section>
            </div>

        </section>
        </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/clinic_data.js"></script>
<script src="js/clinic_cards.js"></script>
<script src="js/my_dashboard.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("나의 대시보드");
  })();
</script>
</body>
</html>
