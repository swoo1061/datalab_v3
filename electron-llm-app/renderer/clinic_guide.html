<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 병원 가이드</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/clinic_guide.css" />
</head>
<body class="theme-vivid">

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope clinic-page clinic-guide-dense">

      <div class="guide-header">
        <div class="title-stack">
          <h1 class="h1">병원 가이드</h1>
          <p class="sub">핵심 정보 · 의료진 · 수가를 빠르게 확인합니다.</p>
        </div>
        <div class="header-actions">
          <label class="field-label">병원 선택</label>
          <select id="clinicSelect" class="select"></select>
        </div>
      </div>

      <!-- 병원 요약 -->
      <section class="guide-summary">
        <div class="summary-item">
          <div class="label muted">병원명</div>
          <div class="value" id="clinicName">-</div>
        </div>
        <div class="summary-item">
          <div class="label muted">위치</div>
          <div class="meta-value" id="clinicLocation">-</div>
        </div>
        <div class="summary-item">
          <div class="label muted">운영시간</div>
          <div class="meta-value" id="clinicHours">-</div>
        </div>
        <div class="summary-item">
          <div class="label muted">주차</div>
          <div class="meta-value" id="clinicParking">-</div>
        </div>
        <div class="summary-item summary-wide">
          <div class="label muted">상담 프로세스</div>
          <div class="meta-value" id="clinicProcess">-</div>
        </div>
      </section>

      <!-- 의료진 / 수가 -->
      <section class="guide-main">
        <div class="doctor-panel">
          <div class="panel-hd">의료진</div>
          <div class="nav-list" id="doctorTabs"></div>
        </div>

        <div class="price-panel">
          <div class="panel-hd">
            <div>
              <div class="label muted">선택 의료진</div>
              <div class="content-title" id="doctorTitle">-</div>
            </div>
            <div class="content-meta" id="priceCount">0개 항목</div>
          </div>
          <div class="panel-bd">
            <table class="table" id="priceTable">
              <thead>
                <tr>
                  <th style="width: 70%;">시술/항목</th>
                  <th style="width: 30%; text-align:right;">금액</th>
                </tr>
              </thead>
              <tbody id="priceTbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 상담실장 / 사후관리 -->
      <section class="guide-support">
        <div class="support-card">
          <div class="panel-hd">상담실장</div>
          <div class="panel-bd" id="consultants">-</div>
        </div>
        <div class="support-card">
          <div class="panel-hd">사후관리</div>
          <div class="panel-bd" id="aftercare">-</div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/clinic_guide.js"></script>
<script>
  (async () => {
    await loadLayout();          // ⭐ 사이드바 로드
    await loadHeader("병원 가이드"); // 기존 header.js 그대로
  })();
</script>
</body>
</html>
