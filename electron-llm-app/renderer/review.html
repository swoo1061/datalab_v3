<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | AI 리뷰 생성</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/review.css" />
</head>
<body>

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope review-page">

      <div class="topbar">
        <div>
          <h1 class="h1">AI 리뷰 생성</h1>
          <p class="sub">병원/의료진/모델 선택 후 즉시 결과를 생성합니다.</p>
        </div>
        <div class="actions">
          <button class="btn" onclick="goDashboard()">대시보드</button>
        </div>
      </div>

      <section class="grid main">
        <div class="card">
          <div class="card-hd">설정</div>
          <div class="card-bd">
            <div class="field">
              <label class="label">병원 선택</label>
              <select id="clinicSelect" class="select" onchange="onClinicChange()">
                <option value="">병원을 선택하세요</option>
              </select>
            </div>

            <div class="field">
              <label class="label">담당 원장</label>
              <select id="doctorSelect" class="select" disabled>
                <option value="">원장님을 선택하세요</option>
              </select>
            </div>

            <div class="field">
              <label class="label">AI 모델</label>
              <div id="modelList" class="model-list"></div>
            </div>

            <button class="btn btn-primary" style="width:100%;" onclick="generateReview()">리뷰 생성</button>
          </div>
        </div>

        <div class="card">
          <div class="card-hd">결과</div>
          <div class="card-bd">
            <textarea id="result" class="result" readonly placeholder="리뷰 생성 결과가 여기에 표시됩니다."></textarea>

            <div class="result-actions">
              <button class="btn" onclick="copyResult()">복사</button>
              <button class="btn" onclick="generateReview()">다시 생성</button>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/header.js"></script>
<script src="js/review.js"></script>
<script>
  (async () => {
    await loadLayout();          // ⭐ 사이드바 로드
    await loadHeader("AI 리뷰 생성"); // 기존 header.js 그대로
  })();
</script>
</body>
</html>
