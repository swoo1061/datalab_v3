<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | AI 리뷰 생성</title>

  <!-- 기존 공통 CSS -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />

  <!-- review 전용 -->
  <link rel="stylesheet" href="css/review.css" />
</head>
<body class="review-basic-page">

<div class="app-root">
  <div id="globalLoading" class="global-loading hidden" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-text">리뷰 생성 중입니다…</div>
      <div class="loading-sub">잠시만 기다려주세요</div>
    </div>
  </div>
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope review-page">

      <!-- ================== 메인 레이아웃 ================== -->
      <section class="review-layout">
        <div class="card review-left">
          <div class="card-hd">키워드 입력</div>
          <div class="card-bd">
            <div class="field-group">
              <div class="row">
                <label>리뷰 정보 입력 (필수)</label>
                <textarea
                  id="keywordInput"
                  class="input"
                  rows="14"
                  placeholder="예시:
병원: OO성형외과
시술: 눈매교정 + 앞트임
컨텐츠: 시술 1주차 후기
톤: 솔직하고 자연스럽게, 귀여운 말투
mbti: ENFP
길이: 15문장 내외, 500자 내외
권장: 자연스러움, 회복 빠름
금지: 가격/할인 직접 언급"
                ></textarea>
                <!-- <div class="hint">Basic처럼 자유 입력으로 생성합니다.</div> -->
              </div>
            </div>

            <div class="field-group">
              <div class="row">
                <label>AI 모델</label>
                <div id="modelList" class="model-list"></div>
              </div>
            </div>

            <div class="action-row">
              <button id="generateReviewBtn" class="btn btn-primary full" onclick="generateReview()">
                리뷰 생성
              </button>
            </div>
          </div>
        </div>

        <div class="card review-right">
          <div class="card-hd">프롬프트 미리보기</div>
          <div class="card-bd">
            <div id="previewMetaMain" class="preview-meta"></div>
          </div>
        </div>

      </section>

    </main>
  </div>
</div>

<!-- 결과 모달 -->
<div id="reviewModal" class="modal modal-lock hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-panel card">
    <div class="card-hd">
      <strong>AI 리뷰 결과</strong>
      <div class="modal-actions">
        <button id="copyModalBtn" class="btn btn-secondary btn-sm">전체 복사</button>
        <button id="saveModalBtn" class="btn btn-secondary btn-sm">수정 저장</button>
        <button class="close-btn" onclick="closeModal()">X</button>
      </div>
    </div>

    <!-- 🔥 반드시 modal-body -->
    <div class="modal-body">
      <!-- <details class="modal-preview" open>
        <summary>미리보기</summary>
        <div class="preview-wrap">
          <ul class="summary" id="summary"></ul>
          <div class="preview">
            <strong>프롬프트 미리보기</strong>
            <div id="previewMeta" class="preview-meta"></div>
          </div>

          <div class="persona-preview">
            <strong>페르소나</strong>
            <div id="personaPreview" class="persona-tags"></div>
            <pre id="promptPreview" class="prompt-box"></pre>
          </div>
        </div>
      </details> -->

      <div id="reviewLoading" class="review-loading hidden">
        AI가 리뷰를 작성 중입니다…
      </div>

      <div id="titleSuggestions" class="title-suggestions hidden">
        <strong>제목 추천</strong>
        <ul id="titleSuggestionList"></ul>
      </div>

      <div id="modalReview" class="review-output" spellcheck="false"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/review.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("AI 리뷰 생성");
  })();
</script>
</body>
</html>
