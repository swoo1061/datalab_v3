<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 업무 페이지</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/clinic_page.css" />
  <link rel="stylesheet" href="css/schedule.css" />
</head>
<body>

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope clinicpage-scope">
  <section class="page-canvas">

    <!-- 1. 병원 컨텍스트 헤더 -->
    <header class="clinic-context card">
      <div class="context-left">
        <h1 class="h1" id="clinicTitle">병원명</h1>
      </div>

      <div class="context-kpi">
        <div class="kpi">
          <span class="kpi-label">게시글</span>
          <span class="kpi-value" id="kpiPosts">-</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">후기</span>
          <span class="kpi-value" id="kpiReviews">-</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">이슈</span>
          <span class="kpi-value danger" id="kpiIssues">-</span>
        </div>
      </div>
    </header>

    <!-- 2. 필터/본문 레이아웃 -->
    <div class="clinic-body">
      <section class="filter-bar card">
        <div class="filter-grid">
          <div class="filter-field">
            <label>월</label>
            <input type="month" id="monthFilter" class="month-input" />
          </div>

          <div class="filter-field">
            <label>구분</label>
            <div class="seg-tabs">
              <button class="seg-tab active" data-type="opinion"
                onclick="setPostType('opinion')">여론</button>
              <button class="seg-tab" data-type="review"
                onclick="setPostType('review')">후기</button>
            </div>
          </div>

          <div class="filter-field span-2">
            <label>플랫폼</label>
            <div class="pill-row" id="platformPills"></div>
          </div>

        </div>

        <div class="filter-actions">
          <button class="btn primary" onclick="reloadClinicPage()">조회</button>
        </div>
      </section>

      <section class="result-panel">
        <div class="result-grid">
        <div class="result-left">
        <div class="ai-intake card">
          <div class="card-hd">데일리 업무 일지 (AI 자동 접수)</div>
          <div class="card-bd">
            <div class="ai-intake-grid">
              <div class="ai-field span-2">
                <label>URL</label>
                <input id="aiIntakeUrl" class="input" placeholder="게시글 URL" />
              </div>
              <div class="ai-field">
                <label>플랫폼</label>
                <select id="aiIntakePlatform" class="select"></select>
              </div>
              <div class="ai-field">
                <label>제목 (선택)</label>
                <input id="aiIntakeTitle" class="input" placeholder="자동 분류 정확도 향상" />
              </div>
              <div class="ai-field span-2">
                <label>사진 첨부</label>
                <input id="aiIntakePhotos" class="input" type="file" multiple />
                <div class="ai-file-hint" id="aiIntakePhotoHint">선택된 파일 없음</div>
              </div>
            </div>

            <div class="ai-intake-actions">
              <button id="aiIntakeSubmit" class="btn primary">AI 처리 후 저장</button>
              <div class="ai-review-dropdown">
                <button id="aiIntakeReviewBtn" class="btn">리뷰 작성</button>
                <div class="ai-review-menu">
                  <button class="menu-item theme-ai" data-type="ai">AI 리뷰작성</button>
                  <button class="menu-item theme-gangnam" data-type="gangnam">강남언니</button>
                  <button class="menu-item theme-babytok" data-type="babytok">바비톡</button>
                  <button class="menu-item theme-yeoshin" data-type="yeoshin">여신티켓</button>
                </div>
              </div>
              <span id="aiIntakeStatus" class="worklog-status"></span>
            </div>
            <p class="ai-intake-hint">댓글/조회수는 크롤링 연동 시 자동 반영됩니다.</p>
          </div>
        </div>

        </div>

        <div class="post-list card" id="postList">
          <div class="muted" style="padding:14px;">불러오는 중...</div>
        </div>
        </div>
      </section>

    </div>
  </section>
</main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/clinic_page.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("업무");
  })();
</script>
</body>
</html>
