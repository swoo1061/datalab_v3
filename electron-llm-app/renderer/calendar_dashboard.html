<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Datalab90 | 캘린더 대시보드</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/schedule.css" />
  <link rel="stylesheet" href="css/calendar_dashboard.css" />
</head>
<body>

<div class="app-root">
  <div class="app-sidebar-slot" id="appSidebar"></div>
  <div class="app-header-slot" id="appHeader"></div>

  <div class="app-main">
    <main class="page-scope calendar-dashboard">
      <section class="page-canvas">
        <header class="page-head">
          <h1 class="h1">캘린더 대시보드</h1>
          <p class="sub">병원별 작업 캘린더를 한 화면에서 관리합니다.</p>
        </header>

        <section class="calendar-filter card">
          <div class="filter-grid">
            <div class="filter-field">
              <label>병원</label>
              <select id="calendarClinicSelect" class="select"></select>
            </div>
            <div class="filter-field">
              <label>월</label>
              <input type="month" id="calendarMonth" class="month-input" />
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn primary" id="calendarRefreshBtn">조회</button>
          </div>
        </section>

        <section class="calendar-panel card">
          <div class="card-hd">병원별 월 캘린더</div>
          <div class="card-bd">
            <div class="schedule-grid">
              <div class="schedule-card">
                <div class="card-hd">월 캘린더</div>
                <div class="card-bd" id="calendarBoard"></div>
              </div>
              <div class="schedule-card">
                <div class="card-hd">선택일 상세</div>
                <div class="card-bd">
                  <div id="calendarList" class="schedule-list"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/header.js"></script>
<script src="js/schedule_calendar.js"></script>
<script src="js/calendar_dashboard.js"></script>
<script>
  (async () => {
    await loadLayout();
    await loadHeader("캘린더 대시보드");
  })();
</script>
</body>
</html>
